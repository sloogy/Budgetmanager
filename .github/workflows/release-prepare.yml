name: Prepare Release Tag

on:
  push:
    branches:
      - 'release-trigger/v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: budgetmanager-release-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: "!startsWith(github.event.head_commit.message, '[release-status]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Release-Anforderung auswerten
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="${GITHUB_REF_NAME#release-trigger/v}"
          VERSION="${REQUEST%%-r*}"
          TAG="v${VERSION}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$REQUEST" != "$VERSION" && ! "$REQUEST" =~ ^${VERSION}-r[1-9][0-9]*$ ]]; then
            echo "Ungültiger Retry-Suffix: ${REQUEST}" >&2
            exit 1
          fi

          IS_RETRY=false
          if [[ "$REQUEST" != "$VERSION" ]]; then
            IS_RETRY=true
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IS_RETRY=$IS_RETRY" >> "$GITHUB_ENV"

          if [[ "$IS_RETRY" == "true" ]]; then
            git fetch origin --tags
            if ! git rev-parse --verify "${TAG}^{commit}" >/dev/null 2>&1; then
              echo "Retry angefordert, aber Tag ${TAG} existiert nicht." >&2
              exit 1
            fi
            TARGET_SHA="$(git rev-parse "${TAG}^{commit}")"
            echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
            echo "Retry: bestehender unveränderlicher Tag ${TAG} auf ${TARGET_SHA} wird neu gebaut."
          fi

      - name: Version setzen und Release-Metadaten synchronisieren
        if: env.IS_RETRY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - "$VERSION" <<'PY'
          import re, sys
          from pathlib import Path

          app = Path('app_info.py')
          text = app.read_text(encoding='utf-8')
          text, count = re.subn(
              r'^APP_VERSION\s*=\s*"[^"]+"',
              f'APP_VERSION = "{sys.argv[1]}"',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit('APP_VERSION nicht eindeutig gefunden')
          app.write_text(text, encoding='utf-8')
          PY
          python tools/normalize_bank_import_sort_i18n.py
          python tools/normalize_bank_import_sort_i18n.py --check
          python tools/gepinnte_werkzeuge.py black views/bank_import_dialog.py views/bank_import_dialog_runtime.py
          python tools/gepinnte_werkzeuge.py black --check views/bank_import_dialog.py views/bank_import_dialog_runtime.py
          python tools/sync_version.py
          python tools/sync_version.py --check

      - name: Synchronisierten Release-Commit erzeugen
        if: env.IS_RETRY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .release-trigger
          git add -A
          # Frueh und verstaendlich abbrechen: Ein Push mit dem GITHUB_TOKEN,
          # der eine Workflow-Datei aendert, wird von GitHub abgelehnt
          # ("without `workflows` permission"). Ohne diese Zeile faellt das
          # erst beim Push auf, mit einer Meldung, die nach einem
          # Rechteproblem aussieht statt nach dem, was es ist.
          if ! git diff --cached --quiet -- .github/workflows; then
            echo "Der Release-Commit aendert Workflow-Dateien - das kann der" >&2
            echo "Release-Lauf nicht pushen. Diese Aenderung gehoert in einen" >&2
            echo "normalen Commit auf main, vor den Release-Trigger:" >&2
            git diff --cached --name-only -- .github/workflows >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "[release] BudgetManager v${VERSION}"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Main fast-forwarden und Tag unveränderlich setzen
        if: env.IS_RETRY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Release-Branch ist kein Fast-Forward von main; Abbruch." >&2
            exit 1
          fi
          git push origin HEAD:main

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            test "$REMOTE_SHA" = "$(git rev-parse HEAD)" || {
              echo "Tag ${TAG} existiert bereits auf anderem Commit; kein Force-Move." >&2
              exit 1
            }
          else
            git tag "$TAG" HEAD
            git push origin "$TAG"
          fi
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Bestehenden Full-Release starten
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="${TARGET_SHA:-$(git rev-parse HEAD)}"
          gh workflow run build.yml --ref "$TAG"
          RUN_ID=""
          for _ in $(seq 1 45); do
            RUN_ID="$(gh run list --workflow build.yml --event workflow_dispatch --limit 30 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${TARGET_SHA}\") | .databaseId" | head -n1)"
            [ -n "$RUN_ID" ] && break
            sleep 2
          done

          if [ -z "$RUN_ID" ]; then
            echo "RUN_ID=not-found" >> "$GITHUB_ENV"
            echo "RELEASE_RESULT=failure" >> "$GITHUB_ENV"
            echo "Release-Run für ${TARGET_SHA} nicht gefunden." >&2
            exit 0
          fi

          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Release workflow run: $RUN_ID"
          if gh run watch "$RUN_ID" --exit-status; then
            echo "RELEASE_RESULT=success" >> "$GITHUB_ENV"
          else
            echo "RELEASE_RESULT=failure" >> "$GITHUB_ENV"
          fi

      - name: Full-Release-Status auf dem Triggerbranch markieren
        if: always() && env.RELEASE_RESULT != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"

          mkdir -p .release-status
          rm -f ".release-status/${TAG}.ok" ".release-status/${TAG}.failed"
          SUFFIX=ok
          if [[ "$RELEASE_RESULT" != "success" ]]; then
            SUFFIX=failed
          fi
          printf 'tag=%s\ncommit=%s\nworkflow_run=%s\nstatus=%s\n' \
            "$TAG" "$TARGET_SHA" "$RUN_ID" "$RELEASE_RESULT" \
            > ".release-status/${TAG}.${SUFFIX}"
          git add ".release-status/${TAG}.${SUFFIX}"
          git commit -m "[release-status] ${TAG} full release ${RELEASE_RESULT}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fehlgeschlagenen Full-Release melden
        if: env.RELEASE_RESULT != 'success'
        shell: bash
        run: |
          echo "Full-Release ${TAG} fehlgeschlagen; Workflow-Run: ${RUN_ID}" >&2
          exit 1
