name: Prepare Release Tag

on:
  push:
    branches:
      - 'release-trigger/v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: budgetmanager-release-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version setzen und Release-Metadaten synchronisieren
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#release-trigger/}"
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python - "$VERSION" <<'PY'
          import re, sys
          from pathlib import Path

          app = Path('app_info.py')
          text = app.read_text(encoding='utf-8')
          text, count = re.subn(
              r'^APP_VERSION\s*=\s*"[^"]+"',
              f'APP_VERSION = "{sys.argv[1]}"',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit('APP_VERSION nicht eindeutig gefunden')
          app.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/build.yml')
          source = workflow.read_text(encoding='utf-8')
          if 'on:\n  workflow_dispatch:\n' not in source:
              source = source.replace(
                  'on:\n  push:\n', 'on:\n  workflow_dispatch:\n  push:\n', 1
              )
          workflow.write_text(source, encoding='utf-8')
          PY
          python tools/sync_version.py
          python tools/sync_version.py --check

      - name: Synchronisierten Release-Commit erzeugen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "release: BudgetManager ${GITHUB_REF_NAME#release-trigger/v}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: main, Tag und Release-Lauf auf denselben Commit binden
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#release-trigger/}"

          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Release-Branch ist kein Fast-Forward von main; Abbruch." >&2
            exit 1
          fi
          git push origin HEAD:main

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} existiert bereits; Abbruch statt Überschreiben." >&2
            exit 1
          fi
          git tag "$TAG" HEAD
          git push origin "$TAG"

          gh workflow run build.yml --ref "$TAG"
          sleep 5
          RUN_ID="$(gh run list --workflow build.yml --branch "$TAG" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          echo "Vollständiger Release-Lauf: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status
