name: Platform Release Gates

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fedora-wayland-scaling:
    name: Fedora ${{ matrix.fedora }} Wayland scale ${{ matrix.scale }}
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ["42", "latest"]
        scale: ["1.0", "1.25", "1.5", "2.0"]
    steps:
      - name: Install Fedora runtime
        run: |
          dnf install -y \
            git python3 python3-pip python3-devel gcc \
            mesa-libEGL mesa-libGL libxkbcommon libxkbcommon-x11 \
            fontconfig dbus-libs wayland wayland-protocols weston \
            google-noto-color-emoji-fonts procps-ng

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install locked dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --require-hashes -r requirements-dev.lock
          python3 -m pip check

      - name: Native Wayland release self-test
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="/tmp/budgetmanager-xdg-${{ matrix.scale }}"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-ci --idle-time=0 \
            >"/tmp/weston-${{ matrix.scale }}.log" 2>&1 &
          WESTON_PID=$!
          trap 'kill "$WESTON_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            test -S "$XDG_RUNTIME_DIR/wayland-ci" && break
            sleep 0.5
          done
          test -S "$XDG_RUNTIME_DIR/wayland-ci" || {
            cat "/tmp/weston-${{ matrix.scale }}.log"
            exit 1
          }
          export WAYLAND_DISPLAY=wayland-ci
          export QT_QPA_PLATFORM=wayland
          export BM_ALLOW_WAYLAND=1
          export QT_SCALE_FACTOR="${{ matrix.scale }}"
          export QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
          export BM_SELF_TEST_SCREENSHOT_DIR="audit_artifacts/screenshots/fedora-${{ matrix.fedora }}-scale-${{ matrix.scale }}"
          mkdir -p "$BM_SELF_TEST_SCREENSHOT_DIR"
          python3 main.py --release-self-test | tee "audit_artifacts/release-self-test-fedora-${{ matrix.fedora }}-${{ matrix.scale }}.json"
          python3 main.py --updater-self-test

      - name: Upload Fedora visual smoke evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: visual-smoke-fedora-${{ matrix.fedora }}-scale-${{ matrix.scale }}
          path: audit_artifacts/
          if-no-files-found: warn

  windows-scaling:
    name: Windows scale ${{ matrix.scale }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scale: ["1.0", "1.25", "1.5", "2.0"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check
      - name: Native Windows release self-test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "windows"
          $env:QT_SCALE_FACTOR = "${{ matrix.scale }}"
          $env:BM_SELF_TEST_SCREENSHOT_DIR = "audit_artifacts/screenshots/windows-scale-${{ matrix.scale }}"
          New-Item -ItemType Directory -Force -Path $env:BM_SELF_TEST_SCREENSHOT_DIR | Out-Null
          python main.py --release-self-test | Tee-Object -FilePath "audit_artifacts/release-self-test-windows-${{ matrix.scale }}.json"
          if ($LASTEXITCODE -ne 0) { throw "Windows GUI-Selbsttest fehlgeschlagen" }
          python main.py --updater-self-test
          if ($LASTEXITCODE -ne 0) { throw "Windows Updater-Selbsttest fehlgeschlagen" }

      - name: Upload Windows visual smoke evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: visual-smoke-windows-scale-${{ matrix.scale }}
          path: audit_artifacts/
          if-no-files-found: warn

  accessibility-contract:
    name: Keyboard and accessibility contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.13"
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y at-spi2-core libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
      - name: Accessibility and keyboard tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_LINUX_ACCESSIBILITY_ALWAYS_ON: "1"
        run: |
          python -m pytest -q tests/test_release_usability_gates.py tests/test_gui_smoke.py
          python main.py --release-self-test
          python main.py --updater-self-test
