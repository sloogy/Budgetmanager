[pytest]
# Bis v3.0.6 hatte das Repository ueberhaupt keine pytest-Konfiguration.
# tests/conftest.py sammelt im Teardown ausdruecklich Muell ein, "damit
# Ressourcenlecks sofort auffallen" - nur konnte niemand sie werten: ohne
# filterwarnings blieb jede Warnung eine Zeile im Bericht, die kein Gate liest.
testpaths = tests

# Eine nicht geschlossene sqlite3-Verbindung ist ein Fehler, keine Notiz.
# Unter Windows blockiert das offene Dateihandle das Aufraeumen von tmp_path,
# und push-checks.yml faehrt seit v3.0.7 auch windows-latest.
#
# Wichtig zur Reichweite: sqlite3 meldet "unclosed database" erst ab Python
# 3.13. Der CI-Pin ist 3.12, dort feuert diese Regel also nie - sie ist der
# Fangzaun fuer den Tag, an dem der Pin steigt, und fuer jeden, der lokal ein
# neueres Python faehrt. Genau diese Luecke hat die 68 Warnungen des
# v3.0.6-Audits erzeugt: Sie waren nur auf einem 3.14-Rechner sichtbar.
#
# Bewusst auf diese eine Meldung eingegrenzt. Ein pauschales
# error::ResourceWarning wuerde auch Warnungen aus Fremdbibliotheken zu
# Testfehlern machen, auf die dieses Projekt keinen Zugriff hat.
#
# Die zweite Zeile ist noetig, damit die erste ueberhaupt etwas bewirkt:
# sqlite3 warnt aus __del__, also aus einem nicht auswertbaren Kontext. Ein
# "error" dort wird zur unraisable exception, die pytest nur als Warnung
# weiterreicht - der Testlauf bliebe gruen. Erst beide Zeilen zusammen machen
# aus einer offenen Verbindung einen roten Test.
filterwarnings =
    error:unclosed database:ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
