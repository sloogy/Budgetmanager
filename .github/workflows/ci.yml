# v2.2.15 (M4): Fehler sollen VOR dem Release-Tag auffallen, nicht erst danach.
# Dieser Workflow laeuft bei jedem Push auf main und bei Pull Requests und
# fuehrt die schnellen Qualitaets-Gates aus. Der Tag-Workflow (build.yml)
# bleibt fuer Builds und Veroeffentlichung zustaendig.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Compile
        run: python -m compileall -q .

      - name: Version sync
        run: python tools/sync_version.py --check

      - name: i18n audit
        run: python tools/i18n_audit.py

      - name: Lint / release procedure
        run: python tools/lint_procedure_check.py

      - name: Type-check model and security-critical modules
        run: python -m mypy model/ updater/manifest_signing.py utils/secure_excel.py utils/ui_experience_mode.py

      - name: Architecture quality gate
        run: python tools/architecture_quality_gate.py

      - name: Release logic audit
        run: python tools/release_logic_audit_100.py

      - name: Tests and full coverage (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p audit_artifacts
          python -m pytest -q \
            -W error::ResourceWarning \
            -W error::pytest.PytestUnraisableExceptionWarning \
            --cov --cov-branch \
            --cov-report=term \
            --cov-report=xml:audit_artifacts/coverage_full.xml \
            --cov-report=json:audit_artifacts/coverage_full.json \
            --cov-fail-under=40
          python tools/coverage_gate.py \
            --json audit_artifacts/coverage_full.json \
            --summary-json audit_artifacts/coverage_gate_summary.json \
            --overall-min 40

      - name: Upload unambiguous coverage evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            audit_artifacts/coverage_full.xml
            audit_artifacts/coverage_full.json
            audit_artifacts/coverage_gate_summary.json
          if-no-files-found: warn

      - name: Large database performance gate
        if: matrix.python-version == '3.13'
        run: |
          python tools/performance_release_gate.py \
            --rows 50000 \
            --json-out audit_artifacts/performance_gate.json

      - name: Upload performance evidence
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: large-database-performance
          path: audit_artifacts/performance_gate.json
          if-no-files-found: warn
