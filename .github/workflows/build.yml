name: Build Executables

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/**'
      - main

permissions:
  contents: write

# Ein Release baut und veroeffentlicht genau einmal. Vorher lief der Bau auch
# bei einem [release]-Commit auf main - beim Release werden main und Tag
# zusammen gepusht, also zweimal fuer denselben Stand. Beide Laeufe luden
# unter denselben Tag hoch, und die Assets sind signiert: latest.json traegt
# die Hashes der ZIPs. Kommen Manifest und ZIP aus verschiedenen Builds,
# passt die Signatur nicht mehr, und der Updater lehnt fail-closed ab - genau
# der Schutz aus Loop 3, ausgehebelt durch einen Wettlauf.
#
# Der Tag ist jetzt der einzige Weg zum Release, wie in den anderen drei
# Programmen der Suite. Die Sperre darunter faengt den Fall zusaetzlich ab.
concurrency:
  group: budgetmanager-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync_release_metadata:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize release metadata
        run: python tools/sync_version.py

      - name: Commit synchronized metadata when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Release-Metadaten bereits synchron."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md README_INSTALLATION.md CHANGELOG.md FEATURES.md VERSION_INFO.txt \
            version.json module.json latest.json.template \
            requirements.lock requirements-dev.lock requirements-build.lock \
            installer/budgetmanager_setup.iss updater/README.md updater/generate_manifest.py \
            docs/architecture.md docs/DAU_TEST_ERSTSTART.md docs/features.md \
            docs/latest.json.template docs/migration-guide.md docs/open-tasks.md \
            docs/package-overview.md docs/release-checklist.md docs/themes.md \
            docs/USER_GUIDE.de.md docs/USER_GUIDE.en.md docs/USER_GUIDE.fr.md \
            docs/help/README.md docs/help/index.html
          git commit -m "chore: sync release metadata for v$(python -c 'from app_info import APP_VERSION; print(APP_VERSION)')"
          git push origin "HEAD:${{ github.ref_name }}"

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: BudgetManager-windows
            pyinstaller_output: dist/BudgetManager
            module_platform: windows-x86_64
            module_label: Windows_x86_64

          - os: ubuntu-latest
            artifact_name: BudgetManager-linux
            pyinstaller_output: dist/BudgetManager
            module_platform: linux-x86_64
            module_label: Linux_x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python tools/verify_hashed_lock.py
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: Install Qt offscreen dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$mirror_list" ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$mirror_list"
          fi
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Check version consistency
        run: python tools/sync_version.py --check

      - name: Verify Qt translation catalogs
        run: python tools/verify_qt_translations.py

      - name: Compile all sources
        run: python -m compileall -q . -x '_attic|__pycache__|.venv|venv'

      - name: Check model formatting
        run: |
          python -m black --version
          python -m black --check model/

      - name: Type-check model layer
        run: python -m mypy model/

      - name: Linting (Fehler, die den Start verhindern)
        run: python -m ruff check . --select E9,F63,F7,F82

      - name: Ausnahmen-Ratchet
        run: python tools/exception_audit.py

      - name: Run core tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest tests/ -v -ra --tb=short

      - name: Clean generated test artifacts
        run: python tools/clean_release_tree.py

      - name: Verify lint and release procedure
        run: python tools/lint_procedure_check.py

      - name: Embed update trust anchor
        env:
          UPDATE_SIGNING_PUBLIC_KEY_B64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_B64 }}
        run: python tools/materialize_update_public_key.py

      - name: Build with PyInstaller
        run: pyinstaller BudgetManager.spec --noconfirm --clean

      - name: Validate PyInstaller onedir output
        shell: bash
        run: |
          test -d "${{ matrix.pyinstaller_output }}"
          test -f "${{ matrix.pyinstaller_output }}/BudgetManager.exe" || test -f "${{ matrix.pyinstaller_output }}/BudgetManager"
          test -d "${{ matrix.pyinstaller_output }}/_internal"
          ls -lah "${{ matrix.pyinstaller_output }}"

      - name: Build unsigned LifePlanner module package
        shell: bash
        run: |
          VERSION="$(python -c 'from app_info import APP_VERSION; print(APP_VERSION)')"
          python tools/build_lifeplanner_module.py \
            --runtime-dir "${{ matrix.pyinstaller_output }}" \
            --runtime-name BudgetManager \
            --platform "${{ matrix.module_platform }}" \
            --output "release/budgetmanager_${VERSION}_${{ matrix.module_label }}.lpmodule" \
            --allow-unsigned

      - name: Upload onedir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.pyinstaller_output }}
          if-no-files-found: error

      - name: Upload LifePlanner module artifact
        uses: actions/upload-artifact@v4
        with:
          name: BudgetManager-lpmodule-${{ matrix.module_label }}
          path: release/*.lpmodule*
          if-no-files-found: error

  installer:
    if: (startsWith(github.ref, 'refs/tags/v')) && needs.build.result == 'success'
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows onedir artifact
        uses: actions/download-artifact@v4
        with:
          name: BudgetManager-windows
          path: dist/BudgetManager/

      - name: Prepare installer input
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\BudgetManager\BudgetManager.exe")) {
            throw "dist\BudgetManager\BudgetManager.exe fehlt; Installer kann nicht gebaut werden."
          }
          if (-not (Test-Path "dist\BudgetManager\_internal")) {
            throw "dist\BudgetManager\_internal fehlt; Build ist nicht onedir."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe nicht gefunden." }
          & $iscc "installer\budgetmanager_setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno-Setup-Build fehlgeschlagen." }
          $setup = Get-ChildItem -Path . -Filter "BudgetManager_Setup_*.exe" -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw "Installer-EXE wurde nicht erzeugt." }
          Copy-Item -Force $setup.FullName "BudgetManager_Setup.exe"

      - name: Test silent install, app start and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:RUNNER_TEMP "BudgetManager-Smoke-App"
          $dataDir = Join-Path $env:RUNNER_TEMP "BudgetManager-Smoke-Data"
          $setup = (Resolve-Path "BudgetManager_Setup.exe").Path

          $install = Start-Process -FilePath $setup -ArgumentList @(
            "/SP-", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            "/DIR=`"$installDir`"", "/DATA_DIR=`"$dataDir`"", "/LANG=english"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent-Installation fehlgeschlagen (Exitcode $($install.ExitCode))."
          }

          $appExe = Join-Path $installDir "BudgetManager.exe"
          $markerPath = Join-Path $installDir "installation.json"
          $settingsPath = Join-Path $dataDir "budgetmanager_settings.json"
          foreach ($required in @($appExe, $markerPath, $settingsPath)) {
            if (-not (Test-Path $required)) {
              throw "Installer-Smoke-Test: erwartete Datei fehlt: $required"
            }
          }

          $marker = Get-Content -Raw $markerPath | ConvertFrom-Json
          $versionLine = Select-String -Path "app_info.py" -Pattern '^APP_VERSION = "([^"]+)"'
          if (-not $versionLine) { throw "APP_VERSION nicht gefunden." }
          $expectedVersion = $versionLine.Matches[0].Groups[1].Value
          if ($marker.version -ne $expectedVersion) {
            throw "Installierte Version $($marker.version) passt nicht zu $expectedVersion."
          }

          $env:QT_QPA_PLATFORM = "offscreen"
          $selfTestResult = Join-Path $env:RUNNER_TEMP "BudgetManager-release-self-test.json"
          $env:BM_SELF_TEST_RESULT_PATH = $selfTestResult
          $app = Start-Process -FilePath $appExe -ArgumentList @("--release-self-test") -Wait -PassThru
          if (-not (Test-Path $selfTestResult)) {
            throw "Der Starttest hat keine Ergebnisdatei erzeugt: $selfTestResult"
          }
          $selfTestJson = Get-Content -Raw $selfTestResult
          Write-Host "Release-Selbsttest: $selfTestJson"
          if ($app.ExitCode -ne 0) {
            throw "Starttest der installierten App fehlgeschlagen (Exitcode $($app.ExitCode)): $selfTestJson"
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Uninstaller fehlt: $uninstaller"
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Silent-Deinstallation fehlgeschlagen (Exitcode $($uninstall.ExitCode))."
          }
          if (Test-Path $appExe) {
            throw "BudgetManager.exe ist nach der Deinstallation noch vorhanden."
          }
          if (-not (Test-Path $settingsPath)) {
            throw "Die Deinstallation hat den gewählten Nutzerdatenordner entfernt."
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BudgetManager_Setup.exe
          path: BudgetManager_Setup.exe
          if-no-files-found: error

  manifest:
    if: (startsWith(github.ref, 'refs/tags/v')) && needs.build.result == 'success' && needs.installer.result == 'success'
    needs: [build, installer]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install signing dependency
        shell: bash
        run: |
          PIN="$(grep -m1 '^cryptography==' requirements.txt)"
          test -n "${PIN}" || { echo "cryptography fehlt in requirements.txt"; exit 1; }
          python -m pip install --disable-pip-version-check "${PIN}"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: BudgetManager-windows
          path: artifacts/windows/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: BudgetManager-linux
          path: artifacts/linux/

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: BudgetManager_Setup.exe
          path: artifacts/windows/

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'from app_info import APP_VERSION; print(APP_VERSION)')"
          TAG="v${VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu APP_VERSION ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build release assets + updater manifest
        shell: bash
        env:
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
          UPDATE_SIGNING_PUBLIC_KEY_B64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_B64 }}
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          VERSION="${{ steps.release_meta.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          python tools/build_release_assets.py \
            --version "${VERSION}" \
            --release-tag "${TAG}" \
            --base-url "${BASE}" \
            --windows-build-dir artifacts/windows \
            --linux-build-dir artifacts/linux \
            --out-dir release_assets \
            --require-installer

          echo "Release assets:"
          ls -lah release_assets

      - name: Build one-time v2.2.61 trust bridge
        shell: bash
        env:
          UPDATE_SIGNING_PUBLIC_KEY_B64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_B64 }}
        run: |
          python tools/build_legacy_trust_bridge.py \
            --out release_assets/BudgetManager-v2.2.61-Trust-Bridge.ps1

      - name: Download Windows LifePlanner module
        uses: actions/download-artifact@v4
        with:
          name: BudgetManager-lpmodule-Windows_x86_64
          path: release_assets/

      - name: Download Linux LifePlanner module
        uses: actions/download-artifact@v4
        with:
          name: BudgetManager-lpmodule-Linux_x86_64
          path: release_assets/

      - name: Verify updater manifest stays updater-safe
        shell: bash
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          data = json.loads(Path('release_assets/latest.json').read_text(encoding='utf-8'))
          assets = data['assets']
          assert assets['windows']['type'] == 'portable-zip', assets['windows']
          assert assets['linux']['type'] == 'portable-zip', assets['linux']
          assert assets['windows']['url'].endswith('-portable-windows.zip'), assets['windows']
          assert assets['linux']['url'].endswith('-portable-linux.zip'), assets['linux']
          assert assets['windows_installer']['type'] == 'installer', assets['windows_installer']
          assert assets['windows_installer_zip']['type'] == 'installer-zip', assets['windows_installer_zip']
          assert 'direct_windows_exe' not in assets
          assert 'direct_linux_binary' not in assets
          assert Path('release_assets/SHA256SUMS.txt').is_file()
          assert Path('release_assets/latest.json.sig').is_file(), (
              'latest.json.sig fehlt - sind UPDATE_SIGNING_PRIVATE_KEY_B64 '
              '(Secret) und UPDATE_SIGNING_PUBLIC_KEY_B64 (Variable) gesetzt?')

          module_packages = sorted(Path('release_assets').glob('budgetmanager_*.lpmodule'))
          assert len(module_packages) == 2, module_packages
          for package in module_packages:
              assert package.with_suffix(package.suffix + '.sha256').is_file(), package
              with zipfile.ZipFile(package) as zf:
                  names = set(zf.namelist())
                  assert 'component.json.sig' not in names, package
                  assert 'component.json' in names, package
                  assert 'payload/module.json' in names, package

          with zipfile.ZipFile(next(Path('release_assets').glob('*-portable-windows.zip'))) as zf:
              names = set(zf.namelist())
              assert 'BudgetManager.exe' in names
              assert 'start-windows.cmd' in names
              assert 'data/.keep' in names
              assert any(n.startswith('_internal/') for n in names), 'Windows-ZIP ohne _internal/'
          with zipfile.ZipFile(next(Path('release_assets').glob('*-portable-linux.zip'))) as zf:
              names = set(zf.namelist())
              assert 'BudgetManager' in names
              assert 'start-linux.sh' in names
              assert 'data/.keep' in names
              assert any(n.startswith('_internal/') for n in names), 'Linux-ZIP ohne _internal/'
          print('latest.json und portable ZIPs OK')
          PY

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release_assets/*
