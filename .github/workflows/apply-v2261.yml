name: Apply audited v2.2.61

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.event.head_commit.message == '[apply-v2.2.61] Bootstrap audited release integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact bootstrap chain
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expected stable base and bootstrap-only delta
        shell: bash
        run: |
          set -euo pipefail
          expected='bce30df750e988ad7bd87acb97fdebbe5caafde1'
          git merge-base --is-ancestor "$expected" HEAD
          unexpected="$(git diff --name-only "$expected"..HEAD | grep -vE '^\.github/(release-bootstrap/v2261/|workflows/apply-v2261\.yml$)' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unerwartete Änderungen vor Patch-Anwendung:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Reconstruct and verify audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/release-bootstrap/v2261/part_*.b64 | base64 --decode > /tmp/v2261.patch.gz
          echo '6a8bd13140a656c6664de99fb2f50c2c9583a45f8eefbd99eac9e3914621dc9d  /tmp/v2261.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v2261.patch.gz > /tmp/v2261.patch
          echo '375080e03ccff0ff36759c48d3b2a60521412304686ca00d19c0685d28493ac8  /tmp/v2261.patch' | sha256sum -c -
          git apply --check /tmp/v2261.patch
          git apply /tmp/v2261.patch

      - name: Remove one-time bootstrap material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/release-bootstrap
          rm -f .github/workflows/apply-v2261.yml

      - name: Commit audited v2.2.61 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'BudgetManager v2.2.61 stability and portable release'
          git push origin HEAD:main

      - name: Start normal signed Windows/Linux release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_tag=v2.2.61; then
              exit 0
            fi
            sleep 3
          done
          exit 1
