name: Temporary v2.2.67 full release validation

on:
  pull_request:
    branches:
      - validation/v2.2.67-base

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/v2.2.67-full

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python tools/verify_hashed_lock.py
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: Install Qt offscreen dependencies
        shell: bash
        run: |
          set -euo pipefail
          mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$mirror_list" ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$mirror_list"
          fi
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Remove validation-only workflow from tested tree
        run: rm -f .github/workflows/temp_v2267_full_regression.yml

      - name: Check version consistency
        run: python tools/sync_version.py --check

      - name: Verify Qt translation catalogs
        run: python tools/verify_qt_translations.py

      - name: Compile all sources
        run: python -m compileall -q . -x '_attic|__pycache__|.venv|venv'

      - name: Check model formatting
        run: python -m black --check model/

      - name: Type-check model layer
        run: python -m mypy model/

      - name: Run complete test suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest tests/ -v -ra --tb=short

      - name: Clean generated test artifacts
        run: python tools/clean_release_tree.py

      - name: Verify lint and release procedure
        run: python tools/lint_procedure_check.py
