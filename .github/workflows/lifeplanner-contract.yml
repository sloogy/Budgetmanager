name: LifePlanner contract

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_lifeplanner_import_inbox.py \
          tests/test_lifeplanner_outbox_legacy_regression_v2259.py \
          tests/test_lifeplanner_host_contract.py \
          tests/test_lifeplanner_host_baseline_regression_v2259.py \
          tests/test_lifeplanner_module_release.py \
          tests/test_lifeplanner_dual_platform_release_v2259.py
