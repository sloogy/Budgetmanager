name: Build Executables

on:
  push:
    tags:
      - 'v*'          # Trigger: git tag v2.0.8 && git push origin v2.0.8

permissions:
  contents: write

jobs:
  # ── Job 1+2: Parallel Builds ─────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: BudgetManager-windows.exe
            pyinstaller_output: dist/BudgetManager.exe

          - os: ubuntu-latest
            artifact_name: BudgetManager-linux
            pyinstaller_output: dist/BudgetManager

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install -r requirements-dev.txt

      - name: Install UPX (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y upx-ucl

      - name: Install Qt offscreen dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx --no-progress -y

      - name: Check version consistency
        run: python tools/sync_version.py --check

      - name: Compile all sources (syntax check incl. tools/)
        run: python -m compileall -q . -x '_attic|__pycache__'

      - name: Check model formatting
        run: python -m black --check model/

      - name: Type-check model layer
        run: python -m mypy model/

      - name: Run core tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest tests/ -v -ra --tb=short

      - name: Build with PyInstaller
        run: pyinstaller BudgetManager.spec --noconfirm

      - name: Rename artifact
        shell: bash
        run: mv "${{ matrix.pyinstaller_output }}" "${{ matrix.artifact_name }}"

      - name: Upload artifact (for manifest job)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  # ── Job 3: Windows Installer bauen ───────────────────────────────
  installer:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: BudgetManager-windows.exe
          path: dist/

      - name: Prepare installer input
        shell: pwsh
        run: |
          if (Test-Path "dist\BudgetManager-windows.exe") {
            Move-Item -Force "dist\BudgetManager-windows.exe" "dist\BudgetManager.exe"
          }
          if (-not (Test-Path "dist\BudgetManager.exe")) {
            throw "dist\BudgetManager.exe fehlt; Installer kann nicht gebaut werden."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe nicht gefunden." }
          & $iscc "installer\budgetmanager_setup.iss"
          $setup = Get-ChildItem -Path . -Filter "BudgetManager_Setup_*.exe" -Recurse | Select-Object -First 1
          if (-not $setup) { throw "Installer-EXE wurde nicht erzeugt." }
          Copy-Item -Force $setup.FullName "BudgetManager_Setup.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BudgetManager_Setup.exe
          path: BudgetManager_Setup.exe

  # ── Job 4: ZIP + latest.json generieren & hochladen ──────────────────
  manifest:
    needs: [build, installer]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: BudgetManager-windows.exe
          path: artifacts/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: BudgetManager-linux
          path: artifacts/

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: BudgetManager_Setup.exe
          path: artifacts/

      - name: Build portable ZIP + latest.json
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          WIN_EXE_NAME="BudgetManager-v${VERSION}-windows.exe"
          LIN_EXE_NAME="BudgetManager-v${VERSION}-linux"
          ZIP_NAME="BudgetManager-v${VERSION}-portable.zip"
          SETUP_NAME="BudgetManager_Setup_${VERSION}.exe"

          # ── Versionierte Einzeldateien für das GitHub Release ────────
          cp artifacts/BudgetManager-windows.exe "${WIN_EXE_NAME}"
          cp artifacts/BudgetManager-linux "${LIN_EXE_NAME}"
          cp artifacts/BudgetManager_Setup.exe "${SETUP_NAME}"
          chmod +x "${LIN_EXE_NAME}"

          # ── Portable-Ordnerstruktur aufbauen ─────────────────────────
          mkdir -p portable/data/backups

          # Executables im ZIP stabil benennen. Release-Assets bleiben versioniert,
          # aber der In-App-Updater braucht im portablen Ordner stabile Startpunkte.
          cp artifacts/BudgetManager-windows.exe "portable/BudgetManager.exe"
          cp artifacts/BudgetManager-linux "portable/BudgetManager"
          chmod +x "portable/BudgetManager"

          # Platzhalter damit data/ nicht leer ist
          touch portable/data/.keep
          touch portable/data/backups/.keep

          # Windows-Starter: stabiler Einstiegspunkt
          cat > portable/start-windows.cmd <<'STARTWIN'
          @echo off
          setlocal EnableExtensions
          set "DIR=%~dp0"
          start "" "%DIR%BudgetManager.exe"
          STARTWIN

          # Linux-Starter: stabiler Einstiegspunkt
          cat > portable/start-linux.sh <<'STARTER'
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          chmod +x "$DIR/BudgetManager"
          exec "$DIR/BudgetManager" "$@"
          STARTER
          chmod +x portable/start-linux.sh

          # README
          cat > portable/README.txt <<RDME
          BudgetManager ${VERSION} — Portable
          =====================================
          Windows : Doppelklick auf start-windows.cmd oder BudgetManager.exe
          Linux   : ./start-linux.sh  (oder chmod +x BudgetManager && ./BudgetManager)

          Daten (DB, Einstellungen, Backups) werden in ./data/ gespeichert.
          Stick einfach mitnehmen — alles bleibt portabel.

          Hinweis zum Updater:
          Der Updater lädt dieses portable ZIP und ersetzt nur Programmdateien.
          data/ und updates/ bleiben erhalten.
          RDME

          # ── ZIP erstellen ────────────────────────────────────────────
          cd portable && zip -r "../${ZIP_NAME}" . && cd ..

          # ── SHA256 berechnen ─────────────────────────────────────────
          WIN_SHA=$(sha256sum "${WIN_EXE_NAME}" | awk '{print $1}')
          LIN_SHA=$(sha256sum "${LIN_EXE_NAME}" | awk '{print $1}')
          ZIP_SHA=$(sha256sum "${ZIP_NAME}" | awk '{print $1}')
          SETUP_SHA=$(sha256sum "${SETUP_NAME}" | awk '{print $1}')

          # ── latest.json schreiben ────────────────────────────────────
          # Wichtig: windows/linux zeigen bewusst auf das portable ZIP.
          # Der In-App-Updater kann ZIPs sicher stagen; direkte EXE-Assets
          # können unter Windows nicht zuverlässig über sich selbst ersetzt werden.
          cat > latest.json <<EOF
          {
            "app": "Budgetmanager",
            "channel": "stable",
            "version": "${VERSION}",
            "release_tag": "${TAG}",
            "assets": {
              "windows": {
                "type": "portable-zip",
                "url": "${BASE}/${ZIP_NAME}",
                "sha256": "${ZIP_SHA}"
              },
              "linux": {
                "type": "portable-zip",
                "url": "${BASE}/${ZIP_NAME}",
                "sha256": "${ZIP_SHA}"
              },
              "portable_zip": {
                "type": "portable-zip",
                "url": "${BASE}/${ZIP_NAME}",
                "sha256": "${ZIP_SHA}"
              },
              "windows_installer": {
                "type": "installer",
                "url": "${BASE}/${SETUP_NAME}",
                "sha256": "${SETUP_SHA}"
              },
              "direct_windows_exe": {
                "type": "exe",
                "url": "${BASE}/${WIN_EXE_NAME}",
                "sha256": "${WIN_SHA}"
              },
              "direct_linux_binary": {
                "type": "binary",
                "url": "${BASE}/${LIN_EXE_NAME}",
                "sha256": "${LIN_SHA}"
              }
            }
          }
          EOF

          echo "WIN_EXE_NAME=${WIN_EXE_NAME}" >> "$GITHUB_ENV"
          echo "LIN_EXE_NAME=${LIN_EXE_NAME}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "SETUP_NAME=${SETUP_NAME}" >> "$GITHUB_ENV"
          echo "ZIP: ${ZIP_NAME}"
          cat latest.json

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.WIN_EXE_NAME }}
            ${{ env.LIN_EXE_NAME }}
            ${{ env.ZIP_NAME }}
            ${{ env.SETUP_NAME }}
            latest.json
