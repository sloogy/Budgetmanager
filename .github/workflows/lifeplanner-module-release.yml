name: LifePlanner module release

on:
  workflow_dispatch:
  push:
    tags:
      - "v2.2.60"

permissions:
  contents: write

jobs:
  module:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: Windows_x86_64
            platform_key: windows-x86_64
          - os: ubuntu-latest
            platform: Linux_x86_64
            platform_key: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install pyinstaller cryptography

      - name: Materialize application updater public key
        env:
          UPDATE_SIGNING_PUBLIC_KEY_B64: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY_B64 }}
        run: python tools/materialize_update_public_key.py
      - name: Validate LifePlanner contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_lifeplanner_host_contract.py tests/test_lifeplanner_module_release.py
      - name: Build application
        run: python -m PyInstaller BudgetManager.spec --noconfirm --clean
      - name: Build signed module package
        env:
          LIFEPLANNER_UPDATE_PRIVATE_KEY_B64: ${{ secrets.LIFEPLANNER_UPDATE_PRIVATE_KEY_B64 }}
        run: >-
          python tools/build_lifeplanner_module.py
          --runtime-dir dist/BudgetManager
          --runtime-name BudgetManager
          --platform ${{ matrix.platform_key }}
          --output release/budgetmanager_2.2.60_${{ matrix.platform }}.lpmodule
      - uses: actions/upload-artifact@v4
        with:
          name: budgetmanager-${{ matrix.platform }}
          path: release/*.lpmodule*
      - name: Publish module asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" release/*.lpmodule* --clobber
