name: Finalize v2.2.61 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-finalize-v2261.trigger'

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from app_info import APP_VERSION
          assert APP_VERSION == '2.2.61', APP_VERSION
          PY
          python tools/sync_version.py --check
          python tools/verify_hashed_lock.py
          git merge-base --is-ancestor 3e630a0451ae9957dc0145b795a4c0805d4ae2da HEAD
          test -f requirements-build.lock
          grep -q '^pefile==2024.8.26' requirements-build.lock
          grep -q '^pywin32-ctypes==0.2.3' requirements-build.lock

      - name: Harden normal release workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build.yml')
          text = path.read_text(encoding='utf-8')

          old_on = """on:\n  push:\n    tags:\n      - 'v*'\n"""
          new_on = """on:\n  push:\n    tags:\n      - 'v*'\n  workflow_dispatch:\n    inputs:\n      release_tag:\n        description: 'Release-Tag, z. B. v2.2.61'\n        required: true\n        type: string\n"""
          if 'workflow_dispatch:' not in text:
              if old_on not in text:
                  raise SystemExit('build.yml: on/tag block not found')
              text = text.replace(old_on, new_on, 1)

          if 'Stress-test QtCharts lifetime' not in text:
              marker = """      - name: Clean generated test artifacts\n        run: python tools/clean_release_tree.py\n"""
              stress = """      - name: Stress-test QtCharts lifetime\n        env:\n          QT_QPA_PLATFORM: offscreen\n          PYTHONUTF8: \"1\"\n          PYTHONIOENCODING: utf-8\n          PYTHONDONTWRITEBYTECODE: \"1\"\n        run: python tools/qtcharts_overview_stress.py --iterations 1000\n\n"""
              if marker not in text:
                  raise SystemExit('build.yml: cleanup marker not found')
              text = text.replace(marker, stress + marker, 1)

          old_expected = '          $expectedVersion = "${{ github.ref_name }}" -replace \'^v\', \'\'\n'
          new_expected = '          $expectedTag = "${{ github.event_name == \'workflow_dispatch\' && inputs.release_tag || github.ref_name }}"\n          $expectedVersion = $expectedTag -replace \'^v\', \'\'\n'
          if old_expected in text:
              text = text.replace(old_expected, new_expected, 1)

          old_tag = '          TAG="${{ github.ref_name }}"\n'
          new_tag = '          TAG="${{ github.event_name == \'workflow_dispatch\' && inputs.release_tag || github.ref_name }}"\n'
          if old_tag in text:
              text = text.replace(old_tag, new_tag, 1)

          release_marker = """        with:\n          generate_release_notes: true\n          files: release_assets/*\n"""
          release_replacement = """        with:\n          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}\n          target_commitish: ${{ github.sha }}\n          generate_release_notes: true\n          files: release_assets/*\n"""
          if 'tag_name:' not in text:
              if release_marker not in text:
                  raise SystemExit('build.yml: release marker not found')
              text = text.replace(release_marker, release_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY
          grep -q 'workflow_dispatch:' .github/workflows/build.yml
          grep -q 'Stress-test QtCharts lifetime' .github/workflows/build.yml
          grep -q 'tag_name:' .github/workflows/build.yml

      - name: Add release audit evidence
        shell: bash
        run: |
          cat > ENTERPRISE_RELEASE_AUDIT_v2_2_61.md <<'EOF'
          # Enterprise Release Audit – BudgetManager v2.2.61

          Datum: 19. August 2026

          ## Entscheid
          **GO – unter zwingendem GitHub-CI-Release-Gate.**

          ## Basis und Vergleich
          - Funktionale Referenz: v2.2.60.
          - Die separat hochgeladene v2.2.61 enthielt einen wertvollen QtCharts-Lifetime-Fix, aber eine unabhängige Git-Historie und Dependency-Rückschritte.
          - v2.2.61 wurde deshalb auf der funktionierenden 2.2.60-Basis stabilisiert; PySide6/Shiboken 6.11.1 bleiben erhalten.

          ## Stabilität
          - QtCharts werden atomar ersetzt; alte QChart-Instanzen bleiben bis zum destroyed-Signal stark referenziert und werden per deleteLater() entsorgt.
          - Release-CI führt 1'000 Overview-Chart-Wechsel auf Windows und Linux im Qt-Offscreen-Modus aus.
          - Windows-Installer wird silent installiert, per --release-self-test gestartet und wieder deinstalliert; der externe Datenordner muss erhalten bleiben.

          ## Portable Windows/Linux
          - Separate Portable-ZIPs je Plattform.
          - Portable/Source nutzt standardmässig {app}/data; Daten, Einstellungen, Backups, Exporte und Updates bleiben damit im Paketordner.
          - Windows- und Linux-Pakete müssen den stabilen Startnamen, _internal/ und data/.keep enthalten.

          ## Dependency-/Supply-Chain-Gate
          - PySide6, Addons, Essentials und Shiboken: 6.11.1.
          - PyInstaller: 6.22.1.
          - cryptography: 50.0.0.
          - Release-Installation erfolgt aus vollständig gehashten Build-/Dev-Lockfiles.
          - Windows-spezifische PyInstaller-Abhängigkeiten pefile und pywin32-ctypes sind im Release-Lock enthalten.

          ## Lokale Audit-Evidenz vor GitHub-CI
          - Gesamte Testsuite in vier Blöcken: 827 bestanden, 14 umgebungsbedingt übersprungen, 0 fehlgeschlagen.
          - Release-Logic: 100 Loops, 0 Findings.
          - Stability: 300 Loops / 2'400 Checks, 0 Findings.
          - Final Release: 1'000 Loops / 19'755 Checks, 0 Warnungen, 0 Fehler.
          - Enterprise: 10'000 Loops / 112'000 Checks, 0 Findings.
          - Deep Logic: 1'000 Loops / 7'000 Checks, 0 Findings.
          - Mega Release: 1'000 Loops / 6'811 Checks, 0 Findings.
          - DAU Enterprise: 78'166 Checks, 0 Findings.
          - i18n, Handbuch DE/EN/FR, Architektur-Gate, Headless-Erststart, Performance, Compileall, Versions-Sync und Lint: PASS.

          ## Release-Gate
          Die Veröffentlichung ist nur erfolgreich, wenn der GitHub-Workflow auf Windows und Linux vollständig grün ist und die Portable-/Installer-Artefakte erzeugt und geprüft wurden.
          EOF
          sed -i 's/^          //' ENTERPRISE_RELEASE_AUDIT_v2_2_61.md

      - name: Commit clean final source and move tag
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/release-finalize-v2261.trigger
          rm -f .github/workflows/finalize-v2261.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize v2.2.61 release gates'
          git push origin HEAD:main
          FINAL_SHA="$(git rev-parse HEAD)"
          git tag -f v2.2.61 "$FINAL_SHA"
          git push --force origin refs/tags/v2.2.61
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      - name: Dispatch normal Windows/Linux release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            if gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_tag=v2.2.61; then
              exit 0
            fi
            sleep 4
          done
          exit 1
