[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = False
warn_unused_ignores = False
warn_return_any = False
no_strict_optional = True
allow_redefinition = True
pretty = True
show_error_codes = True
exclude = (?x)(^views/|^build/|^dist/|^_attic/|^\.venv/|^__pycache__/)

# requests bringt seine Typen nicht mit; die Stubs stecken in
# types-requests. Ohne diese Zeile meldet mypy den fehlenden Stub als
# Fehler - und "ignore_missing_imports" oben deckt den Fall nicht ab,
# weil mypy die Stubs kennt und nur ihre Installation vermisst.
[mypy-requests.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-PySide6.*]
ignore_missing_imports = True

# Progressive Härtung: sicherheitskritische und neue, Qt-freie Module werden
# strenger geprüft als der historische Rest der Modellschicht.
[mypy-model.restore_bundle]
check_untyped_defs = True
warn_return_any = True
strict_optional = True

[mypy-model.diagnostics]
check_untyped_defs = True
warn_return_any = True
strict_optional = True

[mypy-updater.manifest_signing]
check_untyped_defs = True
warn_return_any = True
strict_optional = True

[mypy-utils.secure_excel]
check_untyped_defs = True
warn_return_any = True
strict_optional = True

[mypy-model.report_export]
check_untyped_defs = True
warn_return_any = True
strict_optional = True

[mypy-utils.ui_experience_mode]
check_untyped_defs = True
warn_return_any = True
strict_optional = True
